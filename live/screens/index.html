<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ekran variantlari</title>
<style>body{margin:0;font:14px system-ui,sans-serif;background:#f6f3ff;color:#241c33}h1{font-size:18px;margin:16px}h2{font-size:15px;margin:20px 16px 8px}p{margin:0 16px 12px;color:#6b6380}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0 16px}.c{background:#fff;border-radius:14px;padding:6px;box-shadow:0 1px 3px rgba(36,28,51,.08)}.c.s{outline:2px solid #6D28D9}.c div{aspect-ratio:1}.c b{display:block;font-size:12px;padding:4px 4px 2px;word-break:break-all}</style></head><body>
<h1>Ekranlar bo'yicha variantlar</h1><p id="toc"></p><p>Har ekran uchun bittasini tanlang. Rangli LottieFiles animatsiyalari tanlangach Baxtlilar rangiga moslanadi (muvaffaqiyat yashil qoladi). «-brend» — siz tanlagan LottieFiles sahnasi Baxtlilar rangida; «baxtlilar-» — Oila bo'limidagi bizning sahnalar.</p><div id="r"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<script>
const io=new IntersectionObserver(es=>es.forEach(e=>{const d=e.target;if(e.isIntersecting){if(!d._a)d._a=lottie.loadAnimation({container:d,renderer:'svg',loop:true,autoplay:true,path:d.dataset.n+'.json'});else d._a.play()}else if(d._a)d._a.pause()}),{rootMargin:'200px'});
fetch('list.json').then(r=>r.json()).then((groups)=>{const star={};const r=document.getElementById('r');const toc=document.getElementById('toc');Object.entries(groups).forEach(([k,list])=>{const h=document.createElement('h2');h.textContent=k+' ('+list.length+')';h.id='g'+Object.keys(groups).indexOf(k);const a=document.createElement('a');a.href='#'+h.id;a.textContent=k;a.style.marginRight='12px';toc.append(a);const g=document.createElement('div');g.className='g';r.append(h,g);list.forEach(n=>{const c=document.createElement('div');c.className='c'+(star[k]===n?' s':'');const d=document.createElement('div');const b=document.createElement('b');b.textContent=(star[k]===n?'⭐ ':'')+n;c.append(d,b);g.append(c);d.dataset.n=n;io.observe(d);});});});
</script></body></html>
